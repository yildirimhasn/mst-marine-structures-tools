<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eksik Kayıtları Tamamla</title><style>body{margin:0;background:#edf3f6;color:#19394d;font:14px Arial}header{padding:22px;background:#173749;color:white}h1{font-size:21px;margin:0}main{padding:22px}label{display:block;margin:14px 0}input[type=text]{display:block;padding:10px;box-sizing:border-box;width:100%;margin-top:6px;border:1px solid #bfd0dc;border-radius:5px}button{padding:11px;border:1px solid #bfd0dc;border-radius:5px;background:white;color:#19394d;cursor:pointer}button:disabled{opacity:.5;cursor:default}.note{font-size:12px;line-height:1.6}#changes{padding:10px;background:white;border-radius:6px;margin:15px 0}.bar{display:flex;gap:10px;flex-wrap:wrap}</style></head><body><header><h1>Eksik Kayıtları Tamamla</h1><span class="mst-release" aria-label="MST sürümü">v0.52.18</span></header><main><h2 id="element"></h2><p class="note">Yalnız boş proje/yapı alanları doldurulur. Mevcut kimlik, geometri, tip, malzeme, ANO ve bağlantı kayıtları korunur.</p><label>Proje<input id="project" type="text" maxlength="120"></label><label>Yapı<input id="structure" type="text" maxlength="120"></label><label><input id="fillUid" type="checkbox"> Eksik UID oluştur</label><p class="note">UID yalnız bağımsız ve bağlantısız çelik boru kazıkta oluşturulur. Tekrarlı kimlikler ve bağlı eleman kimlikleri bu akıştan değiştirilmez.</p><div id="changes"></div><p id="status" role="status"></p><div class="bar"><button id="preview">Değişikliği Önizle</button><button id="apply" disabled>Önizlenen Değişikliği Uygula</button></div></main><script src="record_repair.js"></script></body></html>
