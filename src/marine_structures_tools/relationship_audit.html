<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mesnet ve Bağlantı Kontrolü</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf3f6;color:#19394d;font:14px Arial}header{background:#173749;color:white;padding:22px}h1{font-size:21px;margin:0 0 8px}main{padding:20px}button,select,input{padding:10px;border:1px solid #c2d4df;border-radius:6px;background:white;color:#19394d}button{cursor:pointer}button:hover{background:#e5f3f5}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.metrics div{padding:16px;background:white;border-radius:8px}.metrics b{font-size:26px;display:block;margin-top:8px}table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;padding:12px;border-bottom:1px solid #dce7ed;vertical-align:top}th{background:#dfeaf0}td p{margin:0 0 7px;font-size:12px}.status{font-size:12px;line-height:1.6}.warning{color:#a24816}.good{color:#13745b}.table-wrap{overflow:auto}#search{min-width:200px;flex:1}@media(max-width:650px){.metrics{grid-template-columns:1fr 1fr}}
</style></head><body><header><h1>Mesnet ve Bağlantı Kontrolü</h1><span class="mst-release" aria-label="MST sürümü">v0.52.18</span><div>Kazık → başlık kirişi → prekast → döşeme → bordür</div></header><main><div class="bar"><button onclick="sketchup.audit_refresh()">Yeniden Kontrol Et</button><button onclick="sketchup.audit_export()">Raporu Kaydet · JSON</button><label>Göster <select id="filter"><option value="needs_review">İncelenecek elemanlar</option><option value="all">Tüm elemanlar</option><option value="consistent">Tutarlı bağlantılar</option></select></label><input id="search" aria-label="Eleman veya bulgu ara" placeholder="Eleman veya bulgu ara"></div><p id="message" class="status" role="status"></p><div id="metrics" class="metrics"></div><p id="note" class="status"></p><div class="table-wrap"><table><thead><tr><th>Eleman</th><th>Durum</th><th>Bulgu / Mesnetler</th><th>Model</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>
'use strict';var report=null;
function el(id){return document.getElementById(id)}
function text(tag,value){var n=document.createElement(tag);n.textContent=value;return n}
function clear(n){while(n.firstChild)n.removeChild(n.firstChild)}
function render(){if(!report)return;var target=el('rows');clear(target);var q=el('search').value.trim().toLocaleLowerCase('tr-TR'),filter=el('filter').value;
 var records=report.records.filter(function(r){return (filter==='all'||r.state===filter)&&(!q||[r.id,r.label].concat(r.checks.map(function(c){return c.message})).join(' ').toLocaleLowerCase('tr-TR').includes(q))});
 records.forEach(function(r){var row=document.createElement('tr'),cell=document.createElement('td');cell.appendChild(text('b',r.id));cell.appendChild(text('p',r.label));row.appendChild(cell);
 cell=text('td',r.state==='needs_review'?'İnceleme gerekli':r.state==='consistent'?'Metadata tutarlı':'Yalnız kimlik kontrolü');cell.className=r.state==='needs_review'?'warning':'good';row.appendChild(cell);
 cell=document.createElement('td');r.checks.forEach(function(c){cell.appendChild(text('p',c.message))});r.supports.forEach(function(s){cell.appendChild(text('p','Mesnet: '+s.id))});if(!r.checks.length&&!r.supports.length)cell.appendChild(text('p','Bu türün mesnet ilişkileri bu kontrolde değerlendirilmez.'));row.appendChild(cell);
 cell=document.createElement('td');var b=text('button','Elemanı Göster');b.onclick=function(){sketchup.audit_select(r.key)};cell.appendChild(b);row.appendChild(cell);target.appendChild(row)});
 if(!records.length){var row=document.createElement('tr'),cell=text('td','Bu filtreye uygun eleman yok.');cell.colSpan=4;row.appendChild(cell);target.appendChild(row)}
}
function loadRelationshipAudit(data){report=data;clear(el('metrics'));[['Eleman',data.summary.elements],['İnceleme gerekli',data.summary.needs_review],['Metadata tutarlı',data.summary.consistent],['Yalnız kimlik',data.summary.identity_only]].forEach(function(item){var card=text('div',item[0]);card.appendChild(text('b',item[1]));el('metrics').appendChild(card)});el('note').textContent=data.limitation;el('message').textContent='Son kontrol: '+data.created_at+' · v'+data.version;render()}
function relationshipAuditError(message){el('message').textContent=message}
el('filter').addEventListener('change',render);el('search').addEventListener('input',render);document.addEventListener('DOMContentLoaded',function(){sketchup.audit_ready()});
</script></body></html>
